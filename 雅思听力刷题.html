<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>雅思听力精听工作台 · 剑10-剑20</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'PingFang SC', 'Microsoft YaHei', 'Segoe UI', Roboto, sans-serif;
            background-color: #f7f9fb;
            color: #4a4a4a;
            min-height: 100vh;
        }

        /* ========== 顶部横幅封面 ========== */
        .hero-banner {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 60px 20px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }
        .hero-banner::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: url('images/book19.jpg') center/cover no-repeat, linear-gradient(135deg, #667eea, #764ba2);
            opacity: 0.15;
        }
        .site-switch {
            position: fixed;
            top: 12px;
            left: 12px;
            z-index: 100;
            display: inline-flex;
            align-items: center;
            min-height: 38px;
            padding: 0 14px;
            border: 1px solid rgba(255,255,255,0.5);
            border-radius: 8px;
            background: rgba(255,255,255,0.94);
            color: #4a4a4a;
            text-decoration: none;
            font-size: 0.85rem;
            font-weight: 700;
            box-shadow: 0 4px 14px rgba(0,0,0,0.12);
        }
        .hero-content {
            position: relative;
            z-index: 1;
        }
        .hero-banner h1 {
            color: white;
            font-size: 2.8rem;
            font-weight: 700;
            margin-bottom: 12px;
            text-shadow: 0 2px 10px rgba(0,0,0,0.2);
            letter-spacing: 2px;
        }
        .hero-banner p {
            color: rgba(255,255,255,0.9);
            font-size: 1.1rem;
            margin-bottom: 24px;
        }
        .hero-tags {
            display: flex;
            justify-content: center;
            gap: 16px;
            flex-wrap: wrap;
        }
        .hero-tag {
            background: rgba(255,255,255,0.2);
            backdrop-filter: blur(10px);
            padding: 8px 20px;
            border-radius: 50px;
            color: white;
            font-size: 0.9rem;
            border: 1px solid rgba(255,255,255,0.3);
        }

        /* ========== 主容器 ========== */
        .home-container {
            max-width: 1400px;
            margin: 0 auto;
            padding: 40px 24px;
        }

        /* 统计卡片 */
        .stats-row {
            display: flex;
            gap: 20px;
            margin-bottom: 40px;
            flex-wrap: wrap;
            position: relative;
            z-index: 10;
        }
        .stat-card {
            background: white;
            border-radius: 24px;
            padding: 20px 28px;
            flex: 1;
            min-width: 160px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.03);
            border: 1px solid rgba(0,0,0,0.02);
            transition: transform 0.2s, box-shadow 0.2s;
        }
        .stat-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 12px 30px rgba(0,0,0,0.08);
        }
        .stat-card h3 {
            font-size: 0.9rem;
            font-weight: 500;
            color: #9b9b9b;
            margin-bottom: 8px;
        }
        .stat-number {
            font-size: 2.5rem;
            font-weight: bold;
            color: #4a4a4a;
        }
        .stat-bar {
            margin-top: 12px;
            height: 8px;
            background: #e9ecef;
            border-radius: 10px;
            overflow: hidden;
        }
        .stat-fill {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #667eea, #764ba2);
            border-radius: 10px;
            transition: width 0.5s ease;
        }

        /* 书架封面网格 */
        .books-grid {
            display: flex;
            flex-wrap: wrap;
            justify-content: center;
            gap: 40px;
            transition: all 0.3s;
            position: relative;
            z-index: 5;
        }

        /* 书本卡片容器 */
        .book-card {
            flex: 0 0 auto;
            width: 180px;
            cursor: pointer;
            transition: transform 0.2s, opacity 0.3s, filter 0.3s;
            position: relative;
        }
        .cover {
            aspect-ratio: 720 / 970;
            width: 100%;
            background-color: #e6e9f0;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 12px 24px -8px rgba(0,0,0,0.15);
            transition: box-shadow 0.2s;
        }
        .cover img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            display: block;
        }
        .book-card:hover .cover {
            box-shadow: 0 18px 28px -6px rgba(0,0,0,0.2);
        }
        .book-card:hover {
            transform: translateY(-8px);
        }

        /* 全局模糊/隐藏效果 */
        body.blur-background .books-grid .book-card:not(.active-book) {
            filter: blur(4px);
            opacity: 0.5;
            pointer-events: none;
        }
        body.blur-background .books-grid .book-card.active-book {
            filter: none;
            opacity: 1;
            pointer-events: auto;
            transform: scale(1.05);
            z-index: 100;
            position: relative;
        }

        /* 展开详情卡片 */
        .detail-panel {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 90%;
            max-width: 800px;
            max-height: 85vh;
            background: white;
            border-radius: 32px;
            padding: 32px 28px;
            box-shadow: 0 30px 60px rgba(0,0,0,0.25);
            z-index: 200;
            overflow-y: auto;
        }
        .detail-panel.show {
            display: block;
            animation: fadeUp 0.25s ease;
        }
        @keyframes fadeUp {
            from { opacity: 0; transform: translate(-50%, -48%); }
            to { opacity: 1; transform: translate(-50%, -50%); }
        }
        .detail-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 2px solid #eef2fa;
        }
        .detail-title {
            font-size: 1.6rem;
            font-weight: bold;
            background: linear-gradient(135deg, #667eea, #764ba2);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .close-detail {
            background: #f5f5f5;
            border: none;
            font-size: 1.2rem;
            cursor: pointer;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s;
        }
        .close-detail:hover {
            background: #e0e0e0;
            transform: rotate(90deg);
        }
        .test-group {
            margin-bottom: 24px;
        }
        .test-label {
            font-size: 1.1rem;
            font-weight: bold;
            margin-bottom: 12px;
            color: #333;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        .test-label::before {
            content: '';
            width: 4px;
            height: 20px;
            background: linear-gradient(180deg, #667eea, #764ba2);
            border-radius: 2px;
        }
        .section-buttons {
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
            margin-left: 12px;
        }
        .section-btn {
            background: #f8f9fa;
            padding: 8px 16px;
            border-radius: 20px;
            text-decoration: none;
            color: #555;
            font-size: 0.85rem;
            display: inline-flex;
            align-items: center;
            gap: 6px;
            transition: all 0.2s;
            border: 1px solid #eee;
        }
        .section-btn:hover {
            background: linear-gradient(135deg, #667eea, #764ba2);
            color: white;
            border-color: transparent;
            transform: scale(1.05);
        }
        .check-mark {
            font-size: 0.9rem;
            cursor: pointer;
            opacity: 0.5;
        }
        .check-mark.completed {
            opacity: 1;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }
        @keyframes scaleIn {
            from { transform: scale(0.9); opacity: 0; }
            to { transform: scale(1); opacity: 1; }
        }

        /* ========== 底部提示 ========== */
        .footer-note {
            margin-top: 50px;
            text-align: center;
            font-size: 0.85rem;
            color: #888;
            padding: 16px;
            background: linear-gradient(135deg, #f8f9fa, #fff);
            border-radius: 16px;
            border: 1px solid #eee;
        }
        .footer-note span {
            margin: 0 8px;
        }

        /* ========== 响应式 ========== */
        @media (max-width: 720px) {
            .hero-banner h1 { font-size: 1.8rem; }
            .hero-banner { padding: 40px 16px; }
            .book-card { width: 140px; }
            .detail-panel { padding: 20px; border-radius: 20px; }
            .stat-card { padding: 16px 20px; }
        }
    </style>
</head>
<body>
<a class="site-switch" href="index.html">返回主页</a>

<!-- ========== 顶部横幅封面 ========== -->
<div class="hero-banner">
    <div class="hero-content">
        <h1>🎧 雅思听力精听工作台</h1>
        <p>剑桥雅思真题 · 逐句精听 · 智能错题本</p>
        <div class="hero-tags">
            <span class="hero-tag">📖 剑10-剑20</span>
            <span class="hero-tag">✍️ 逐句填空</span>
            <span class="hero-tag">📝 错题分析</span>
            <span class="hero-tag">💾 本地保存</span>
        </div>
    </div>
</div>

<!-- ========== 主内容 ========== -->
<div class="home-container">
    <!-- 统计卡片 -->
    <div class="stats-row">
        <div class="stat-card">
            <h3>📚 总练习数</h3>
            <div class="stat-number" id="totalCount">0</div>
        </div>
        <div class="stat-card">
            <h3>✅ 已完成</h3>
            <div class="stat-number" id="completedCount">0</div>
            <div class="stat-bar"><div class="stat-fill" id="progressFill"></div></div>
        </div>
        <div class="stat-card">
            <h3>🎯 完成率</h3>
            <div class="stat-number" id="percentComplete">0%</div>
        </div>
    </div>

    <!-- 封面书架 -->
    <div class="books-grid" id="booksGrid"></div>

    <div class="footer-note">
        💡 点击任意封面展开练习 · <span>|</span> ⌨️ 支持快捷键操作
    </div>
</div>

<!-- ========== 详情弹窗 ========== -->
<div id="detailPanel" class="detail-panel">
    <div class="detail-header">
        <span class="detail-title" id="detailBookTitle"></span>
        <button class="close-detail" id="closeDetailBtn">✕</button>
    </div>
    <div id="detailContent"></div>
</div>

<script>
    const START_BOOK = 10;
    const END_BOOK = 20;
    const TESTS_PER_BOOK = 4;
    const SECTIONS_PER_TEST = 4;

    function generateAllKeys() {
        const keys = [];
        for (let book = START_BOOK; book <= END_BOOK; book++) {
            for (let test = 1; test <= TESTS_PER_BOOK; test++) {
                for (let section = 1; section <= SECTIONS_PER_TEST; section++) {
                    keys.push(`C${book}T${test}S${section}`);
                }
            }
        }
        return keys;
    }

    const allKeys = generateAllKeys();
    const totalSections = allKeys.length;
    const STORAGE_KEY = 'ielts_listening_progress';

    function loadProgress() {
        const stored = localStorage.getItem(STORAGE_KEY);
        return stored ? JSON.parse(stored) : {};
    }

    function saveProgress(progress) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(progress));
    }

    function updateStats() {
        const progress = loadProgress();
        const completedCount = Object.keys(progress).filter(k => progress[k] === true).length;
        const percent = totalSections === 0 ? 0 : Math.round((completedCount / totalSections) * 100);
        document.getElementById('totalCount').innerText = totalSections;
        document.getElementById('completedCount').innerText = completedCount;
        document.getElementById('percentComplete').innerText = `${percent}%`;
        document.getElementById('progressFill').style.width = `${percent}%`;
    }

    function getBookProgress(book) {
        const progress = loadProgress();
        let completed = 0;
        let total = 0;
        for (let test = 1; test <= TESTS_PER_BOOK; test++) {
            for (let section = 1; section <= SECTIONS_PER_TEST; section++) {
                const key = `C${book}T${test}S${section}`;
                total++;
                if (progress[key] === true) completed++;
            }
        }
        return { completed, total };
    }

    function renderBookshelf() {
        const container = document.getElementById('booksGrid');
        container.innerHTML = '';
        for (let book = START_BOOK; book <= END_BOOK; book++) {
            const card = document.createElement('div');
            card.className = 'book-card';
            card.setAttribute('data-book', book);
            const coverDiv = document.createElement('div');
            coverDiv.className = 'cover';
            const img = document.createElement('img');
            img.src = `images/book${book}.jpg`;
            img.alt = `剑${book}`;
            img.onerror = () => {
                img.style.display = 'none';
                coverDiv.style.background = 'linear-gradient(135deg, #667eea, #764ba2)';
                coverDiv.style.display = 'flex';
                coverDiv.style.alignItems = 'center';
                coverDiv.style.justifyContent = 'center';
                coverDiv.style.color = 'white';
                coverDiv.style.fontSize = '2rem';
                coverDiv.style.fontWeight = 'bold';
                coverDiv.innerText = `剑${book}`;
            };
            coverDiv.appendChild(img);
            card.appendChild(coverDiv);
            card.addEventListener('click', (e) => {
                e.stopPropagation();
                openBookDetail(book);
            });
            container.appendChild(card);
        }
        updateStats();
    }

    let currentOpenBook = null;
    function openBookDetail(book) {
        if (currentOpenBook === book) {
            closeDetailPanel();
            return;
        }
        currentOpenBook = book;
        const panel = document.getElementById('detailPanel');
        const detailTitle = document.getElementById('detailBookTitle');
        detailTitle.innerText = `剑桥雅思 ${book}`;
        const detailContent = document.getElementById('detailContent');
        const progress = loadProgress();
        let html = '';
        for (let test = 1; test <= TESTS_PER_BOOK; test++) {
            html += `<div class="test-group"><div class="test-label">Test ${test}</div><div class="section-buttons" id="sections-${book}-${test}"></div></div>`;
        }
        detailContent.innerHTML = html;
        
        for (let test = 1; test <= TESTS_PER_BOOK; test++) {
            const container = document.getElementById(`sections-${book}-${test}`);
            if (!container) continue;
            for (let section = 1; section <= SECTIONS_PER_TEST; section++) {
                const key = `C${book}T${test}S${section}`;
                const isCompleted = progress[key] === true;
                const link = document.createElement('a');
                link.href = `practice.html?book=${book}&test=${test}&section=${section}`;
                link.className = 'section-btn';
                link.innerHTML = `Section ${section} <span class="check-mark ${isCompleted ? 'completed' : ''}" data-key="${key}">${isCompleted ? '✅' : '○'}</span>`;
                const checkSpan = link.querySelector('.check-mark');
                checkSpan.addEventListener('click', (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    const newProgress = loadProgress();
                    const current = newProgress[key] === true;
                    if (current) {
                        delete newProgress[key];
                    } else {
                        newProgress[key] = true;
                    }
                    saveProgress(newProgress);
                    openBookDetail(book);
                    updateStats();
                    renderBookshelf();
                });
                container.appendChild(link);
            }
        }
        
        panel.classList.add('show');
        document.body.classList.add('blur-background');
        const allCards = document.querySelectorAll('.book-card');
        allCards.forEach(card => {
            const cardBook = parseInt(card.getAttribute('data-book'));
            if (cardBook === book) {
                card.classList.add('active-book');
            } else {
                card.classList.remove('active-book');
            }
        });
    }
    
    function closeDetailPanel() {
        const panel = document.getElementById('detailPanel');
        panel.classList.remove('show');
        document.body.classList.remove('blur-background');
        currentOpenBook = null;
        const allCards = document.querySelectorAll('.book-card');
        allCards.forEach(card => card.classList.remove('active-book'));
    }

    // ESC 关闭弹窗
    document.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') {
            closeDetailPanel();
        }
    });

    // 事件绑定
    document.getElementById('closeDetailBtn').addEventListener('click', closeDetailPanel);
    window.addEventListener('click', (e) => {
        const panel = document.getElementById('detailPanel');
        if (panel.classList.contains('show') && !panel.contains(e.target) && !e.target.closest('.book-card')) {
            closeDetailPanel();
        }
    });
    
    renderBookshelf();
</script>
</body>
</html>
