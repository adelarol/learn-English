<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>音标训练 · 英语学习中心</title>
    <style>
        /* 主题变量 */
        :root {
            --bg-primary: #f5f7fa;
            --bg-secondary: rgba(0, 0, 0, 0.03);
            --bg-tertiary: rgba(0, 0, 0, 0.07);
            --text-primary: #1a1a2e;
            --text-secondary: rgba(26, 26, 46, 0.6);
            --border-color: rgba(0, 0, 0, 0.08);
            --accent: #4a6cf7;
            --accent-glow: rgba(74, 108, 247, 0.2);
            --note-bg: rgba(74, 108, 247, 0.08);
        }

        [data-theme="dark"] {
            --bg-primary: #0f1428;
            --bg-secondary: rgba(255, 255, 255, 0.03);
            --bg-tertiary: rgba(255, 255, 255, 0.08);
            --text-primary: #e8eaf6;
            --text-secondary: rgba(232, 234, 246, 0.6);
            --border-color: rgba(255, 255, 255, 0.08);
            --accent: #6b8cff;
            --accent-glow: rgba(107, 140, 255, 0.35);
            --note-bg: rgba(107, 140, 255, 0.1);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', 'SF Pro', 'PingFang SC', 'Microsoft YaHei', sans-serif;
            background: var(--bg-primary);
            color: var(--text-primary);
            min-height: 100vh;
            line-height: 1.6;
            transition: background 0.3s ease, color 0.3s ease;
        }

        /* ===== 顶部导航 ===== */
        .top-bar {
            background: var(--bg-primary);
            border-bottom: 1px solid var(--border-color);
            padding: 16px 24px;
            position: sticky;
            top: 0;
            z-index: 100;
            backdrop-filter: blur(10px);
        }
        .top-bar-content {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 16px;
        }
        .bar-left { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
        .back-btn {
            padding: 8px 16px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.25s ease;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 6px;
        }
        .back-btn:hover { background: var(--bg-secondary); transform: translateY(-2px); }
        .page-title { font-size: clamp(1.2rem, 3vw, 1.5rem); font-weight: 600; }
        .page-info { font-size: 0.85rem; color: var(--text-secondary); }
        .bar-right { display: flex; gap: 8px; align-items: center; margin-left: auto; }

        .control-btn {
            width: 40px;
            height: 40px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 1rem;
            cursor: pointer;
            transition: all 0.25s ease;
        }
        .control-btn:hover { transform: translateY(-2px); box-shadow: 0 4px 12px var(--accent-glow); }

        /* ===== 模式标签 ===== */
        .mode-bar {
            max-width: 1200px;
            margin: 20px auto 0;
            padding: 0 24px;
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
        }
        .mode-tab {
            padding: 10px 20px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: var(--text-secondary);
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.25s ease;
        }
        .mode-tab:hover { transform: translateY(-2px); color: var(--text-primary); }
        .mode-tab.active { background: var(--accent); border-color: var(--accent); color: #fff; font-weight: 600; }

        /* ===== 主区域 ===== */
        .main-container { max-width: 1200px; margin: 0 auto; padding: 24px; }
        .mode-sec { display: none; animation: fadeIn 0.25s ease; }
        .mode-sec.active { display: block; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
        .sec-intro { color: var(--text-secondary); font-size: 0.9rem; margin-bottom: 18px; }

        /* ===== 音标卡片 ===== */
        .group-block { margin-bottom: 30px; }
        .group-head { display: flex; align-items: baseline; gap: 10px; margin-bottom: 12px; flex-wrap: wrap; }
        .group-name { font-size: 1.05rem; font-weight: 600; }
        .group-desc { font-size: 0.8rem; color: var(--text-secondary); }
        .phon-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(108px, 1fr));
            gap: 12px;
        }
        .phon-tile {
            position: relative;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            padding: 18px 10px 14px;
            text-align: center;
            cursor: pointer;
            transition: all 0.25s ease;
        }
        .phon-tile:hover {
            transform: translateY(-4px);
            border-color: var(--accent);
            box-shadow: 0 12px 28px var(--accent-glow);
        }
        .tile-play {
            position: absolute;
            top: 8px;
            right: 8px;
            width: 24px;
            height: 24px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 6px;
            font-size: 0.78rem;
            color: var(--text-secondary);
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .tile-play:hover { background: var(--accent-glow); color: var(--accent); }
        .tile-sym {
            display: block;
            font-family: 'Lucida Sans Unicode', 'Segoe UI', 'PingFang SC', sans-serif;
            font-size: 1.55rem;
            font-weight: 600;
            line-height: 1.3;
        }
        .tile-us { display: block; font-size: 0.7rem; color: var(--text-secondary); margin-top: 2px; }
        .tile-word { display: block; font-size: 0.8rem; color: var(--accent); margin-top: 6px; }

        /* ===== 学习面板弹窗 ===== */
        .modal-overlay {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(0, 0, 0, 0.55);
            backdrop-filter: blur(4px);
            z-index: 2000;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .modal-overlay.active { display: flex; }
        .modal-content {
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: 16px;
            width: 100%;
            max-width: 600px;
            max-height: 86vh;
            overflow-y: auto;
            padding: 24px;
        }
        .modal-head { display: flex; align-items: flex-start; gap: 14px; margin-bottom: 14px; }
        .modal-sym {
            font-family: 'Lucida Sans Unicode', 'Segoe UI', 'PingFang SC', sans-serif;
            font-size: clamp(2.2rem, 6vw, 2.7rem);
            font-weight: 700;
            line-height: 1.2;
            color: var(--accent);
        }
        .modal-sym-sub { font-size: 0.85rem; color: var(--text-secondary); margin-top: 4px; }
        .modal-head-right { margin-left: auto; display: flex; flex-direction: column; align-items: flex-end; gap: 8px; }
        .modal-close {
            width: 32px;
            height: 32px;
            border: 1px solid var(--border-color);
            background: var(--bg-tertiary);
            border-radius: 8px;
            color: var(--text-secondary);
            font-size: 1.1rem;
            cursor: pointer;
        }
        .modal-close:hover { color: var(--text-primary); }
        .modal-tags { display: flex; gap: 6px; flex-wrap: wrap; justify-content: flex-end; }
        .tag {
            display: inline-block;
            padding: 2px 10px;
            border-radius: 999px;
            background: var(--bg-tertiary);
            color: var(--text-secondary);
            font-size: 0.75rem;
        }
        .tag.accent { background: var(--accent-glow); color: var(--accent); font-weight: 600; }

        .phon-play-row { display: flex; gap: 8px; margin: 4px 0 14px; flex-wrap: wrap; }
        .btn-primary {
            padding: 10px 22px;
            background: var(--accent);
            border: 1px solid var(--accent);
            border-radius: 10px;
            color: #fff;
            font-size: 0.9rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.25s ease;
        }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 20px var(--accent-glow); }
        .btn-ghost {
            padding: 9px 16px;
            background: var(--bg-tertiary);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-primary);
            font-size: 0.85rem;
            cursor: pointer;
            transition: all 0.25s ease;
        }
        .btn-ghost:hover { transform: translateY(-2px); border-color: var(--accent); }

        .us-note {
            background: var(--note-bg);
            border: 1px dashed var(--accent);
            border-radius: 8px;
            padding: 8px 12px;
            font-size: 0.82rem;
            color: var(--text-secondary);
            margin-bottom: 12px;
        }
        .tip-block {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            padding: 12px 14px;
            font-size: 0.88rem;
            margin-bottom: 10px;
        }
        .tip-block b { display: block; margin-bottom: 4px; font-size: 0.8rem; }
        .tip-tips b { color: var(--accent); }
        .tip-trap b { color: #dc2626; }
        [data-theme="dark"] .tip-trap b { color: #f87171; }

        .block-title {
            font-size: 0.82rem;
            font-weight: 600;
            color: var(--text-secondary);
            margin: 18px 0 8px;
            letter-spacing: 0.02em;
        }
        .word-list { border-top: 1px solid var(--border-color); }
        .word-row {
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 11px 0;
            border-bottom: 1px solid var(--border-color);
        }
        .word-main { min-width: 0; }
        .word-text { font-size: 1.05rem; font-weight: 600; }
        .word-cn { font-size: 0.78rem; color: var(--text-secondary); }
        .word-ipa-wrap { margin-left: auto; text-align: right; }
        .word-ipa {
            font-family: ui-monospace, 'SF Mono', Consolas, monospace;
            font-size: 0.92rem;
            white-space: nowrap;
        }
        .word-ipa.alt { color: var(--text-secondary); font-size: 0.78rem; margin-top: 2px; }
        .ipa-hl { color: var(--accent); font-weight: 700; }
        .play-btn-sm {
            flex: none;
            width: 36px;
            height: 36px;
            border: 1px solid var(--border-color);
            background: var(--bg-tertiary);
            border-radius: 8px;
            cursor: pointer;
            font-size: 0.9rem;
            color: var(--text-primary);
            transition: all 0.2s ease;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .play-btn-sm:hover { border-color: var(--accent); transform: translateY(-2px); }

        .mini-list { display: flex; flex-direction: column; gap: 8px; }
        .mini-pair {
            display: flex;
            align-items: center;
            gap: 12px;
            width: 100%;
            padding: 10px 14px;
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            color: var(--text-primary);
            cursor: pointer;
            text-align: left;
            transition: all 0.2s ease;
            font-family: inherit;
        }
        .mini-pair:hover { border-color: var(--accent); transform: translateX(3px); }
        .mini-syms {
            font-family: 'Lucida Sans Unicode', 'Segoe UI', sans-serif;
            font-weight: 700;
            white-space: nowrap;
        }
        .mini-syms .vs { color: var(--accent); font-size: 0.72rem; margin: 0 5px; }
        .mini-words { font-size: 0.86rem; color: var(--text-secondary); }
        .mini-go { margin-left: auto; font-size: 0.75rem; color: var(--accent); white-space: nowrap; }

        /* ===== 相似读音对比 ===== */
        .pair-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 14px;
        }
        .pair-card {
            background: var(--bg-secondary);
            border: 1px solid var(--border-color);
            border-radius: 14px;
            padding: 18px;
            transition: all 0.25s ease;
        }
        .pair-card:hover { border-color: var(--accent); box-shadow: 0 10px 26px var(--accent-glow); }
        .pair-syms {
            font-family: 'Lucida Sans Unicode', 'Segoe UI', sans-serif;
            font-weight: 700;
            font-size: 1.15rem;
        }
        .pair-syms .vs { color: var(--accent); font-size: 0.78rem; margin: 0 6px; }
        .pair-sub { font-size: 0.75rem; color: var(--text-secondary); margin-top: 2px; }
        .pair-words { display: flex; flex-direction: column; gap: 6px; margin: 12px 0 10px; }
        .pair-word {
            display: flex;
            align-items: center;
            gap: 10px;
            width: 100%;
            padding: 9px 10px;
            background: var(--bg-primary);
            border: 1px solid var(--border-color);
            border-radius: 9px;
            color: var(--text-primary);
            cursor: pointer;
            text-align: left;
            font-family: inherit;
            transition: all 0.2s ease;
        }
        .pair-word:hover { border-color: var(--accent); }
        .pw-speak { font-size: 0.85rem; color: var(--text-secondary); }
        .pw-main { display: flex; flex-direction: column; min-width: 0; }
        .pw-text { font-size: 1.02rem; font-weight: 600; }
        .pw-cn { font-size: 0.74rem; color: var(--text-secondary); }
        .pw-ipa {
            margin-left: auto;
            text-align: right;
            font-family: ui-monospace, 'SF Mono', Consolas, monospace;
            font-size: 0.82rem;
            white-space: nowrap;
        }
        .pw-dj { display: block; color: var(--text-secondary); font-size: 0.72rem; }
        .pair-note {
            font-size: 0.77rem;
            color: var(--text-secondary);
            padding-top: 10px;
            border-top: 1px dashed var(--border-color);
        }
        .pair-actions { display: flex; gap: 8px; margin-top: 12px; flex-wrap: wrap; }
        .pair-actions .btn-ghost { flex: 1; white-space: nowrap; padding: 8px 10px; }

        .empty-hint { text-align: center; color: var(--text-secondary); padding: 30px 0; font-size: 0.85rem; }
        .warn-banner {
            display: none;
            background: rgba(220, 38, 38, 0.1);
            border: 1px solid #dc2626;
            color: #dc2626;
            border-radius: 10px;
            padding: 10px 16px;
            font-size: 0.85rem;
            margin-bottom: 16px;
        }

        @media (max-width: 640px) {
            .top-bar { padding: 12px 16px; }
            .main-container { padding: 16px; }
            .mode-bar { padding: 0 16px; }
            .modal-content { padding: 18px; }
            .word-row { gap: 8px; }
            .pair-grid { grid-template-columns: 1fr; }
        }
    </style>
    <script src="user.js"></script>
</head>
<body>
    <div class="top-bar">
        <div class="top-bar-content">
            <div class="bar-left">
                <a href="index.html" class="back-btn">← 返回</a>
                <div>
                    <h1 class="page-title">音标训练</h1>
                    <div class="page-info">44 个 DJ 音标 · 真人美音 · 例词与相似音对比</div>
                </div>
            </div>
            <div class="bar-right">
                <button class="control-btn" id="themeBtn" title="切换主题"><span id="themeIcon">🌙</span></button>
            </div>
        </div>
    </div>

    <div class="mode-bar">
        <button class="mode-tab active" data-mode="study">🔊 音标发音</button>
        <button class="mode-tab" data-mode="pairs">⚖️ 相似读音对比</button>
    </div>

    <div class="main-container">
        <div class="warn-banner" id="ttsWarn">当前浏览器不支持语音合成，发音功能不可用。请使用 Chrome / Edge 浏览器。</div>

        <section class="mode-sec active" id="studySec">
            <p class="sec-intro">点击音标卡片查看该音的例词和相似音对比；卡片右上角的 🔊 可直接播放真人美音本音。标注采用 DJ 音标，下方小字为对应的美音写法。</p>
            <div id="studyGrid"></div>
        </section>

        <section class="mode-sec" id="pairsSec">
            <p class="sec-intro">每组两个音只差一个音素。点击单词可听发音，「对比音素」用真人美音连续播放两个音，「对比单词」连续朗读两个例词，感受细微差别。</p>
            <div class="pair-grid" id="pairGrid"></div>
        </section>
    </div>

    <div class="modal-overlay" id="studyModal">
        <div class="modal-content" id="modalBody"></div>
    </div>

    <script src="phonetics-data.js"></script>
    <script>
        const $ = id => document.getElementById(id);
        const GROUP_MAP = {};
        PHONETICS_GROUPS.forEach(g => GROUP_MAP[g.key] = g);

        const SYM = p => '/' + p.uk + '/';
        const US_SYM = p => '/' + p.us + '/';
        const IPA = (w, acc) => '/' + w[acc] + '/';

        // 在 IPA 字符串中高亮目标音标符号
        function markIPA(ipa, target) {
            if (!target) return ipa;
            const i = ipa.indexOf(target);
            if (i < 0) return ipa;
            return ipa.slice(0, i) + '<span class="ipa-hl">' + target + '</span>' + ipa.slice(i + target.length);
        }

        // ===== 真音播放：美音真人录音 =====
        const AUDIO_BASE = 'audio/phonetics/us/';
        const audioCache = new Map();
        let currentAudio = null;

        function getAudio(slug) {
            if (audioCache.has(slug)) return audioCache.get(slug);
            const a = new Audio(AUDIO_BASE + slug + '.mp3');
            a.preload = 'auto';
            audioCache.set(slug, a);
            return a;
        }

        function stopAudio() {
            if ('speechSynthesis' in window) speechSynthesis.cancel();
            if (currentAudio) {
                currentAudio.onended = null;
                currentAudio.ontimeupdate = null;
                currentAudio.pause();
                try { currentAudio.currentTime = 0; } catch (e) {}
                currentAudio = null;
            }
        }

        function playSequence(slugs, rate, onDone) {
            stopAudio();
            const step = i => {
                if (i >= slugs.length) {
                    currentAudio = null;
                    if (onDone) onDone();
                    return;
                }
                const a = getAudio(slugs[i]);
                const trim = PHONEME_TRIM[slugs[i]] || [0, 0];
                currentAudio = a;
                a.playbackRate = rate || 1;

                const begin = () => {
                    if (a !== currentAudio) return; // 已被新的播放请求接管
                    if (trim[0] > 0) { try { a.currentTime = trim[0]; } catch (e) {} }
                    if (trim[1] > 0) {
                        // 尾部是静音，到点就收，避免连读时出现长间隔
                        a.ontimeupdate = () => {
                            if (!a.paused && a.currentTime >= trim[1]) {
                                a.onended = null;
                                a.ontimeupdate = null;
                                a.pause();
                                step(i + 1);
                            }
                        };
                    }
                    a.play().catch(() => {
                        if (a !== currentAudio) return;
                        a.onended = null;
                        a.ontimeupdate = null;
                        step(i + 1);
                    });
                };
                a.onended = () => {
                    a.onended = null;
                    a.ontimeupdate = null;
                    step(i + 1);
                };

                // 首次播放时元素可能还没拿到时长，等 metadata 后再定位起播点
                if (a.readyState >= 1) begin();
                else a.addEventListener('loadedmetadata', begin, { once: true });
            };
            step(0);
        }

        // 页面空闲时预取全部真人录音，点击时不用等网络
        function preloadPhonemeAudio() {
            (PHONEME_AUDIO.us || []).forEach(slug => {
                const a = getAudio(slug);
                if (a.readyState === 0) a.load();
            });
        }

        // 美音中没有独立央化双元音，按数据里的组合用真人音素连读
        function phonemeSlugs(p) {
            const chain = PHONEME_US_CHAIN[p.slug];
            return chain || [p.slug];
        }
        function playPhoneme(p, rate) { playSequence(phonemeSlugs(p), rate); }
        function playPhonemePair(pa, pb) { playSequence(phonemeSlugs(pa).concat(phonemeSlugs(pb)), 1); }

        // ===== 单词发音（TTS 美音） =====
        const TTS = {
            voice: null,
            init() {
                if (!('speechSynthesis' in window)) { $('ttsWarn').style.display = 'block'; return; }
                const load = () => {
                    const vs = speechSynthesis.getVoices();
                    if (!vs.length) return;
                    this.voice = vs.find(v => v.lang.toLowerCase().replace('_', '-') === 'en-us'
                            && /aria|jenny|zira|samantha|google us/i.test(v.name))
                        || vs.find(v => v.lang.toLowerCase().replace('_', '-') === 'en-us')
                        || vs.find(v => v.lang.toLowerCase().startsWith('en')) || null;
                };
                load();
                speechSynthesis.onvoiceschanged = load;
            },
            speak(text, rate) {
                if (!('speechSynthesis' in window)) return;
                stopAudio();
                const u = new SpeechSynthesisUtterance(text);
                u.voice = this.voice;
                u.lang = 'en-US';
                u.rate = rate || 1;
                speechSynthesis.speak(u);
            },
            speakSeq(texts, rate) {
                if (!('speechSynthesis' in window)) return;
                stopAudio();
                const step = i => {
                    if (i >= texts.length) return;
                    const u = new SpeechSynthesisUtterance(texts[i]);
                    u.voice = this.voice;
                    u.lang = 'en-US';
                    u.rate = rate || 1;
                    u.onend = () => step(i + 1);
                    u.onerror = () => step(i + 1);
                    speechSynthesis.speak(u);
                };
                step(0);
            }
        };

        // ===== 主题 =====
        function initTheme() {
            const dark = localStorage.getItem('yilinDarkMode') === 'true';
            document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
            $('themeIcon').textContent = dark ? '☀️' : '🌙';
        }
        function toggleTheme() {
            const dark = document.documentElement.getAttribute('data-theme') !== 'dark';
            document.documentElement.setAttribute('data-theme', dark ? 'dark' : 'light');
            localStorage.setItem('yilinDarkMode', dark);
            $('themeIcon').textContent = dark ? '☀️' : '🌙';
        }

        // ===== 模式切换 =====
        function switchMode(mode) {
            document.querySelectorAll('.mode-tab').forEach(t => t.classList.toggle('active', t.dataset.mode === mode));
            document.querySelectorAll('.mode-sec').forEach(s => s.classList.remove('active'));
            $(mode + 'Sec').classList.add('active');
            stopAudio();
        }

        // ===== 音标总览 =====
        function tileHTML(p) {
            const diff = p.uk !== p.us;
            return `<div class="phon-tile" data-id="${p.id}">
                <span class="tile-play" data-play="${p.id}" title="播放真人本音">🔊</span>
                <span class="tile-sym">${SYM(p)}</span>
                <span class="tile-us">${diff ? '美 ' + US_SYM(p) : '英美同形'}</span>
                <span class="tile-word">${p.words[0].w}</span>
            </div>`;
        }

        function renderStudy() {
            $('studyGrid').innerHTML = PHONETICS_GROUPS.map(g => {
                const items = PHONEMES.filter(p => p.group === g.key);
                if (!items.length) return '';
                return `<div class="group-block">
                    <div class="group-head">
                        <span class="group-name">${g.name}</span>
                        <span class="group-desc">${g.desc} · ${items.length} 个</span>
                    </div>
                    <div class="phon-grid">${items.map(tileHTML).join('')}</div>
                </div>`;
            }).join('');

            $('studyGrid').querySelectorAll('.phon-tile').forEach(tile => {
                tile.addEventListener('click', e => {
                    if (e.target.closest('.tile-play')) return;
                    openModal(tile.dataset.id);
                });
            });
            $('studyGrid').querySelectorAll('.tile-play').forEach(btn => {
                btn.addEventListener('click', e => {
                    e.stopPropagation();
                    const p = PHONEMES.find(x => x.id === btn.dataset.play);
                    if (p) playPhoneme(p);
                });
            });
        }

        // ===== 音标详情弹窗 =====
        function openModal(id) {
            const p = PHONEMES.find(x => x.id === id);
            if (!p) return;
            const g = GROUP_MAP[p.group];
            const diff = p.uk !== p.us;
            const related = MINIMAL_PAIRS.filter(x => x.p.includes(p.id));

            const rows = p.words.map(w => {
                const usLine = '美 ' + markIPA(IPA(w, 'us'), p.us);
                const djLine = w.uk !== w.us
                    ? `<div class="word-ipa alt">DJ ${markIPA(IPA(w, 'uk'), p.uk)}</div>` : '';
                return `<div class="word-row">
                    <div class="word-main">
                        <div class="word-text">${w.w}</div>
                        <div class="word-cn">${w.cn}</div>
                    </div>
                    <div class="word-ipa-wrap">
                        <div class="word-ipa">${usLine}</div>
                        ${djLine}
                    </div>
                    <button class="play-btn-sm" data-word="${w.w}" title="播放单词">🔊</button>
                </div>`;
            }).join('');

            const mini = related.length ? related.map(pair => {
                const otherId = pair.p[0] === p.id ? pair.p[1] : pair.p[0];
                const other = PHONEMES.find(x => x.id === otherId);
                return `<button class="mini-pair" data-mini="${pair.id}">
                    <span class="mini-syms">${SYM(p)}<span class="vs">vs</span>${SYM(other)}</span>
                    <span class="mini-words">${pair.a.w} ↔ ${pair.b.w}</span>
                    <span class="mini-go">对比 →</span>
                </button>`;
            }).join('') : '<div class="empty-hint">这个音暂无相似音对</div>';

            $('modalBody').innerHTML = `
                <div class="modal-head">
                    <div>
                        <div class="modal-sym">${SYM(p)}</div>
                        <div class="modal-sym-sub">${diff ? '美音写法 ' + US_SYM(p) : '英美写法相同'}</div>
                    </div>
                    <div class="modal-head-right">
                        <button class="modal-close" id="modalCloseBtn" title="关闭">×</button>
                        <div class="modal-tags">
                            <span class="tag accent">${g.name}</span>
                            ${p.voice ? `<span class="tag">${p.voice}辅音</span>` : ''}
                            <span class="tag">真人美音</span>
                        </div>
                    </div>
                </div>
                <div class="phon-play-row">
                    <button class="btn-primary" id="phonMainBtn">🔊 听本音</button>
                    <button class="btn-ghost" id="phonSlowBtn">🐢 慢速 0.7x</button>
                </div>
                ${p.usNote ? `<div class="us-note">ℹ️ ${p.usNote}</div>` : ''}
                <div class="tip-block tip-tips"><b>💡 口型要领</b>${p.tips}</div>
                <div class="tip-block tip-trap"><b>⚠️ 易错点</b>${p.trap}</div>
                <div class="block-title">包含 ${SYM(p)} 的单词</div>
                <div class="word-list">${rows}</div>
                <div class="block-title">相似读音对比</div>
                <div class="mini-list">${mini}</div>
            `;

            $('studyModal').classList.add('active');
            $('modalCloseBtn').addEventListener('click', closeModal);
            $('phonMainBtn').addEventListener('click', () => playPhoneme(p));
            $('phonSlowBtn').addEventListener('click', () => playPhoneme(p, 0.7));
            $('modalBody').querySelectorAll('[data-word]').forEach(btn => {
                btn.addEventListener('click', () => TTS.speak(btn.dataset.word));
            });
            $('modalBody').querySelectorAll('[data-mini]').forEach(btn => {
                btn.addEventListener('click', () => {
                    const pair = MINIMAL_PAIRS.find(x => x.id === btn.dataset.mini);
                    if (pair) playPairPhonemes(pair);
                });
            });

            playPhoneme(p);
        }

        function closeModal() {
            stopAudio();
            $('studyModal').classList.remove('active');
        }

        // ===== 相似读音对比 =====
        function pairWordHTML(w, phoneme) {
            return `<button class="pair-word" data-word="${w.w}" title="播放 ${w.w}">
                <span class="pw-speak">🔊</span>
                <span class="pw-main">
                    <span class="pw-text">${w.w}</span>
                    <span class="pw-cn">${w.cn}</span>
                </span>
                <span class="pw-ipa">美 ${markIPA(IPA(w, 'us'), phoneme.us)}${w.uk !== w.us ? `<span class="pw-dj">DJ ${IPA(w, 'uk')}</span>` : ''}</span>
            </button>`;
        }

        function pairCardHTML(pair) {
            const pa = PHONEMES.find(x => x.id === pair.p[0]);
            const pb = PHONEMES.find(x => x.id === pair.p[1]);
            return `<div class="pair-card">
                <div class="pair-syms">${SYM(pa)}<span class="vs">vs</span>${SYM(pb)}</div>
                <div class="pair-sub">美音 ${US_SYM(pa)} vs ${US_SYM(pb)}</div>
                <div class="pair-words">
                    ${pairWordHTML(pair.a, pa)}
                    ${pairWordHTML(pair.b, pb)}
                </div>
                <div class="pair-note">${pair.note}</div>
                <div class="pair-actions">
                    <button class="btn-ghost" data-pcmp="${pair.id}">⚖️ 对比音素</button>
                    <button class="btn-ghost" data-wcmp="${pair.id}">🔊 对比单词</button>
                </div>
            </div>`;
        }

        function playPairPhonemes(pair) {
            const pa = PHONEMES.find(x => x.id === pair.p[0]);
            const pb = PHONEMES.find(x => x.id === pair.p[1]);
            if (pa && pb) playPhonemePair(pa, pb);
        }

        function renderPairs() {
            $('pairGrid').innerHTML = MINIMAL_PAIRS.map(pairCardHTML).join('');
            $('pairGrid').querySelectorAll('[data-word]').forEach(btn => {
                btn.addEventListener('click', () => TTS.speak(btn.dataset.word));
            });
            $('pairGrid').querySelectorAll('[data-pcmp]').forEach(btn => {
                btn.addEventListener('click', () => {
                    const pair = MINIMAL_PAIRS.find(x => x.id === btn.dataset.pcmp);
                    if (pair) playPairPhonemes(pair);
                });
            });
            $('pairGrid').querySelectorAll('[data-wcmp]').forEach(btn => {
                btn.addEventListener('click', () => {
                    const pair = MINIMAL_PAIRS.find(x => x.id === btn.dataset.wcmp);
                    if (pair) TTS.speakSeq([pair.a.w, pair.b.w], 0.95);
                });
            });
        }

        // ===== 初始化 =====
        function init() {
            initTheme();
            TTS.init();
            $('themeBtn').addEventListener('click', toggleTheme);
            document.querySelectorAll('.mode-tab').forEach(t => {
                t.addEventListener('click', () => switchMode(t.dataset.mode));
            });
            $('studyModal').addEventListener('click', e => {
                if (e.target === $('studyModal')) closeModal();
            });
            document.addEventListener('keydown', e => {
                if (e.key === 'Escape') closeModal();
            });
            renderStudy();
            renderPairs();
            const idle = window.requestIdleCallback || (fn => setTimeout(fn, 500));
            idle(preloadPhonemeAudio, { timeout: 2000 });
        }
        document.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
